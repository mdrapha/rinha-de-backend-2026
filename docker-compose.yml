services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "10MB"

  api1:
    image: ghcr.io/mdrapha/rinha-backend-2026:latest
    hostname: api1
    environment:
      - PORT=8080
      - INDEX_PATH=/data/index.bin
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "170MB"

  api2:
    image: ghcr.io/mdrapha/rinha-backend-2026:latest
    hostname: api2
    environment:
      - PORT=8080
      - INDEX_PATH=/data/index.bin
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "170MB"
