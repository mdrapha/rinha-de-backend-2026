worker_processes 1;

events {
    worker_connections 512;
}

http {
    access_log off;
    error_log /dev/null crit;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    upstream api {
        server api1:8080;
        server api2:8080;
        keepalive 64;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
